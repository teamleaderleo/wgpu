name: Fieldwork surface characterization

on:
  push:
    branches:
      - fieldwork/surface-config-rejection-state
  pull_request:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fieldwork-surface-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "false"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  public-wrapper:
    name: Public wrapper characterization
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout characterization branch
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93 --no-self-update --profile=minimal --component rustfmt
          rustup override set 1.93
          cargo -V

      - name: Normalize and verify formatting
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          git diff --stat

      - name: Require both characterization identities
        run: |
          cargo test --locked \
            -p wgpu \
            --no-default-features \
            --features std,custom \
            -- --list | tee /tmp/fieldwork-wrapper-tests.txt
          grep -F "surface_texture::tests::ordinary_unpresented_drop_discards" /tmp/fieldwork-wrapper-tests.txt
          grep -F "surface_texture::tests::present_panic_does_not_discard_or_release_after_ownership_commit" /tmp/fieldwork-wrapper-tests.txt

      - name: Run custom-backend presentation tests
        run: |
          cargo test --locked \
            -p wgpu \
            --no-default-features \
            --features std,custom \
            surface_texture::tests \
            -- --nocapture

  browser-compile:
    name: Browser characterization compile
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTFLAGS: --cfg wasm_test -D warnings
    steps:
      - name: Checkout characterization branch
        uses: actions/checkout@v6

      - name: Install Rust and wasm target
        run: |
          rustup toolchain install 1.93 --no-self-update --profile=minimal --component clippy --target wasm32-unknown-unknown
          rustup override set 1.93
          cargo -V

      - name: Compile and lint wasm characterization binary
        run: |
          cargo clippy --locked \
            --target wasm32-unknown-unknown \
            --package wgpu-test \
            --test wgpu-gpu \
            --features webgl,exhaust

  browser-runtime:
    name: Browser surface runtime characterization
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUST_LOG: debug,wasm_bindgen_wasm_interpreter=warn,wasm_bindgen_cli_support=warn,walrus=warn,naga=info
      WASM_BINDGEN_TEST_TIMEOUT: "300"
      WGPU_CI: "true"
    steps:
      - name: Checkout characterization branch
        uses: actions/checkout@v6

      - name: Install Rust and wasm target
        run: |
          rustup toolchain install 1.93 --no-self-update --profile=minimal --target wasm32-unknown-unknown
          rustup override set 1.93
          cargo -V

      - name: Resolve and install wasm-bindgen CLI
        run: |
          WASM_BINDGEN_VERSION=$(cargo metadata --format-version 1 --all-features | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version' | head -n1)
          test -n "$WASM_BINDGEN_VERSION"
          echo "WASM_BINDGEN_VERSION=$WASM_BINDGEN_VERSION" >> "$GITHUB_ENV"
          cargo +stable install wasm-bindgen-cli --version="$WASM_BINDGEN_VERSION" --locked

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: List focused browser tests
        run: |
          cargo xtask test-wasm --list -- --test wgpu-gpu create_surface_error | tee /tmp/fieldwork-browser-tests.txt
          grep -i "canvas_get_context_returned_null" /tmp/fieldwork-browser-tests.txt
          grep -i "unconfigured_browser_surface_reports_lost" /tmp/fieldwork-browser-tests.txt
          grep -i "zero_sized_browser_configuration_is_applied_with_validation" /tmp/fieldwork-browser-tests.txt
          grep -i "rejected_browser_configuration_is_published_and_recoverable" /tmp/fieldwork-browser-tests.txt

      - name: Execute focused browser surface module
        run: |
          cargo xtask test-wasm --test-threads 1 -- --test wgpu-gpu create_surface_error
