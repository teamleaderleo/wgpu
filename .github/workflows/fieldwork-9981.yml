name: Fieldwork wgpu lock-order detector

on:
  pull_request:
    branches:
      - ci/wgpu-9981-base

permissions:
  contents: read

concurrency:
  group: fieldwork-9981-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect queue lock-order inversion
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout investigation branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Run source-order detector
        run: python3 .github/fieldwork/9981-lock-order.py
