name: Fieldwork pre-HAL presentation probe

on:
  push:
    branches:
      - fieldwork/pre-hal-present-failure-noop
  pull_request:
    branches:
      - trunk
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "false"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  core-pre-hal-probe:
    name: Core pre-HAL failure probe
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.93 --no-self-update --profile=minimal --component rustfmt
          rustup override set 1.93
          cargo -V

      - name: Apply deterministic experiment patch
        run: python3 fieldwork/patch_pre_hal_probe.py

      - name: Check patched formatting
        run: cargo fmt --all -- --check

      - name: Execute controlled core ownership experiment
        run: |
          cargo test --locked \
            -p wgpu-core \
            --features noop \
            fieldwork_pre_hal_failure_detaches_without_discard \
            -- --exact --nocapture
